name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing here needs to write to the repository.
permissions:
  contents: read

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # There is no test suite, so these three steps are the whole gate.
      # All of them must pass before anything is merged.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    name: Build the container image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Built but not pushed: no registry has been chosen yet. This exists so
      # the Dockerfile cannot rot unnoticed while nobody is deploying.
      - name: Build image
        run: docker build -t algojudge-client:ci .

      - name: Serve it and check the SPA fallback
        run: |
          docker run -d --name ci-check -p 8080:80 algojudge-client:ci
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8080/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://localhost:8080/ >/dev/null
          # A deep link is not a file on disk; without the nginx fallback this 404s.
          curl -fsS http://localhost:8080/activities/PCN1/problems >/dev/null
          docker stop ci-check
