name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing here needs to write to the repository.
permissions:
  contents: read

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, build and the format checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Read from `.nvmrc`, never written here: a literal `node-version` beside
      # it silently wins and the file stops meaning anything.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # These steps must all pass before anything is merged. **They stopped
      # being the whole gate on 2026-08-30**: `check:ui` below blocks too. Only
      # `check:e2e` is still outside it, because it needs a full stack. Keep
      # this list and the one in CLAUDE.md the same: it said "these three steps"
      # for a while after the `check:` scripts existed, which meant a change
      # could break the package format or the event socket and still go green.
      - name: Lint
        run: npm run lint

      # The dependency lists `lint` cannot see, at every `useApiEffect`.
      - name: Lint dependency lists
        run: npm run lint:deps

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The three formats the Client owns, and the event transport.
      - name: Check the statement format
        run: npm run check:content

      - name: Check the package format
        run: npm run check:package

      # The exchange bundle, and the partition it is: every field of the four
      # manager shapes is carried or deliberately left, and the compiler will
      # not let that list fall behind the API.
      - name: Check the exchange format
        run: npm run check:exchange

      # The converter of §9, against fixtures written from ZawodyWeb's own
      # documented format. The five real archives live in the workspace's
      # untracked `local/`, which CI does not have — the run says so rather
      # than skipping in silence.
      - name: Check the ZawodyWeb converter
        run: npm run check:zawodyweb

      # When a credential for the problem archive may still be sent. Its own
      # step because nothing else can reach the rule: the picker is a live
      # iframe on somebody else's host, so the browser suite has never driven
      # it and must not start.
      - name: Check the archive credential rule
        run: npm run check:access

      - name: Check the event socket
        run: npm run check:events

      # The one defect nothing above can see. A missing key is not an error:
      # i18next falls back to the key, which *is* the English text — so a Polish
      # screen renders an English sentence and every other check stays silent.
      # Four strings were in exactly that state before this ran.
      - name: Check the translations
        run: npm run check:i18n

      # Not a gate: the Server publishes no OpenAPI document yet, so this only
      # prints the endpoints that will have to be served. It is here so the list
      # is visible in every run rather than only when somebody thinks to ask.
      - name: List the endpoints the Server has to serve
        run: npm run check:api

  browser-checks:
    name: The browser checks
    runs-on: ubuntu-latest

    # **This blocks a merge, since 2026-08-30.** It reported and did not block
    # for as long as it could go red without a defect, and the two ways it could
    # are both closed:
    #
    # **Selectors.** It matched Mantine's *generated* class names in 208 places,
    # so a component upgrade reddened it for no product reason. One remains,
    # `[class*=Pill-root]`, which cannot be given a test id from the theme and
    # says so where it is used. Controls are found by `data-testid`; text is
    # still what assertions *judge*, which is the point of the split.
    #
    # **Races.** Three scripts waited for words that were true before the thing
    # they then read existed, and each was fixed at the cause rather than by
    # waiting longer: `maintenance` (a session that redirected the window's
    # parameter away), `exchange` (a row clicked before it carried its handler)
    # and `notifications` (a checkbox that arrives half a second after its
    # heading).
    #
    # **The evidence, so the decision can be re-judged rather than trusted**:
    # four consecutive green runs of this job, the failure before them fixed at
    # cause, and three clean local runs at double the worker count.
    #
    # **`retries` stays 0** — see `playwright.ui.config.mjs`. A red mark that a
    # retry can erase is a red mark nobody fixes, which is the state this change
    # exists to leave.

    # The suite is minutes-long by nature; the longest single script was over
    # three minutes when this was measured.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chromium only. The suite drives one browser, and the other two would be
      # a few hundred megabytes downloaded on every run to sit unused.
      - name: Install the browser
        run: npx playwright install --with-deps chromium

      # The dev server is started by the config's `webServer`, with
      # `VITE_APP_USE_FAKE_API` set — without it every call 404s and every
      # script times out on a login screen.
      - name: Run the browser checks
        run: npm run check:ui

      # `if: always()` because the report of a failed run is the whole reason to
      # keep one: the scripts write a screenshot at every point worth looking
      # at, and a failure that leaves nothing behind has to be reproduced by
      # hand before it can be read.
      - name: Keep the report and the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-checks
          path: |
            playwright-report/
            scripts/verify/out/
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Build the container image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Built and not pushed, which is now a choice rather than a gap: this
      # keeps the Dockerfile from rotting on an ordinary commit, and
      # `release.yml` publishes to `ghcr.io/algojudge/algojudge-client` when
      # somebody pushes a `v*` tag.
      - name: Build image
        run: docker build -t algojudge-client:ci .

      - name: Serve it and check the SPA fallback
        run: |
          docker run -d --name ci-check -p 8080:80 algojudge-client:ci
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8080/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://localhost:8080/ >/dev/null
          # A deep link is not a file on disk; without the nginx fallback this 404s.
          curl -fsS http://localhost:8080/activities/PCN1/problems >/dev/null
          docker stop ci-check

      # The entrypoint writes an operator's own string into a <script> element,
      # which is the one place in this image where a configured value becomes
      # code. The step above proves the container serves; it runs with the empty
      # defaults, so it cannot see an escaping regression. This one hands it a
      # value carrying every character that has ever broken that line.
      - name: Configure it with an awkward value
        env:
          AWKWARD: 'https://api.example.com/"};alert(1);//</script><script>x</script>\back'
        run: |
          docker run -d --name ci-config -p 8081:80 \
            -e API_BASE_URL="$AWKWARD" -e USE_FAKE_API=false algojudge-client:ci
          for i in $(seq 1 15); do
            curl -sS http://localhost:8081/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://localhost:8081/ -o configured.html
          docker stop ci-config
          node -e '
            const html = require("node:fs").readFileSync("configured.html", "utf8");
            const lines = html.split("\n").filter(l => l.includes("__ALGOJUDGE__"));
            if (lines.length !== 1) {
              throw new Error(`expected one configuration line, found ${lines.length}`);
            }
            // Anchored: a value that closed the element early would leave the
            // rest of itself outside the match.
            const m = lines[0].match(/^\s*<script>window\.__ALGOJUDGE__ = (.*);<\/script>$/);
            if (!m) throw new Error("not one well-formed script element: " + lines[0]);
            const parsed = JSON.parse(m[1]);
            // Both strings, or `ApiFactory` stops recognising "true" and
            // `apiBase` throws on .trim().
            if (typeof parsed.apiBaseUrl !== "string" || typeof parsed.useFakeApi !== "string") {
              throw new Error("both values must be strings: " + JSON.stringify(parsed));
            }
            if (parsed.apiBaseUrl !== process.env.AWKWARD) {
              throw new Error(`did not round trip: ${JSON.stringify(parsed.apiBaseUrl)}`
                + ` != ${JSON.stringify(process.env.AWKWARD)}`);
            }
            console.log("ok: the configuration line survived the value intact");
          '
