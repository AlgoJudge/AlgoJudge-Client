name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing here needs to write to the repository.
permissions:
  contents: read

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, build and the format checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # There is no test suite, so these steps are the whole gate, and all of
      # them must pass before anything is merged. Keep this list and the one in
      # CLAUDE.md the same: it said "these three steps" for a while after the
      # `check:` scripts existed, which meant a change could break the package
      # format or the event socket and still go green.
      - name: Lint
        run: npm run lint

      # The dependency lists `lint` cannot see, at every `useApiEffect`.
      - name: Lint dependency lists
        run: npm run lint:deps

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The three formats the Client owns, and the event transport.
      - name: Check the statement format
        run: npm run check:content

      - name: Check the package format
        run: npm run check:package

      # The exchange bundle, and the partition it is: every field of the four
      # manager shapes is carried or deliberately left, and the compiler will
      # not let that list fall behind the API.
      - name: Check the exchange format
        run: npm run check:exchange

      - name: Check the event socket
        run: npm run check:events

      # The one defect nothing above can see. A missing key is not an error:
      # i18next falls back to the key, which *is* the English text — so a Polish
      # screen renders an English sentence and every other check stays silent.
      # Four strings were in exactly that state before this ran.
      - name: Check the translations
        run: npm run check:i18n

      # Not a gate: the Server publishes no OpenAPI document yet, so this only
      # prints the endpoints that will have to be served. It is here so the list
      # is visible in every run rather than only when somebody thinks to ask.
      - name: List the endpoints the Server has to serve
        run: npm run check:api

  browser-checks:
    name: The browser checks (reported, not a gate)
    runs-on: ubuntu-latest

    # **Reported, never blocking**, and that is a decision rather than a
    # temporary state. Two of the three reasons these were kept out of CI are
    # gone: Playwright starts the application itself and brings its own browser,
    # so there is orchestration now, and it takes about twenty minutes rather
    # than being unrunnable. The third reason stands — the scripts match on
    # Polish interface text and on Mantine's generated class names, so a
    # translation or a component upgrade reddens them for no product reason, and
    # blocking a merge on that would teach everybody to ignore a red mark.
    #
    # **What would make this a gate**: assertions addressed through test ids
    # rather than through the words on the screen. Until somebody does that,
    # this is the same bargain as `check:api` above — something worth having in
    # every run and not worth blocking a merge on.
    continue-on-error: true

    # The suite is minutes-long by nature; the longest single script was over
    # three minutes when this was measured.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chromium only. The suite drives one browser, and the other two would be
      # a few hundred megabytes downloaded on every run to sit unused.
      - name: Install the browser
        run: npx playwright install --with-deps chromium

      # The dev server is started by the config's `webServer`, with
      # `VITE_APP_USE_FAKE_API` set — without it every call 404s and every
      # script times out on a login screen.
      - name: Run the browser checks
        run: npm run check:ui

      # `if: always()` because the report of a failed run is the whole reason to
      # keep one: the scripts write a screenshot at every point worth looking
      # at, and a failure that leaves nothing behind has to be reproduced by
      # hand before it can be read.
      - name: Keep the report and the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: |
            playwright-report/
            scripts/verify/out/
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Build the container image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Built and not pushed, which is now a choice rather than a gap: this
      # keeps the Dockerfile from rotting on an ordinary commit, and
      # `release.yml` publishes to `ghcr.io/algojudge/algojudge-client` when
      # somebody pushes a `v*` tag.
      - name: Build image
        run: docker build -t algojudge-client:ci .

      - name: Serve it and check the SPA fallback
        run: |
          docker run -d --name ci-check -p 8080:80 algojudge-client:ci
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8080/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://localhost:8080/ >/dev/null
          # A deep link is not a file on disk; without the nginx fallback this 404s.
          curl -fsS http://localhost:8080/activities/PCN1/problems >/dev/null
          docker stop ci-check
