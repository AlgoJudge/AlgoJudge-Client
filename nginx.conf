server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx defaults this to 1 MB, which is smaller than everything this product
    # uploads: a submission may be 8 MB and a Runner package 128 MB. Over the
    # limit nginx answers 413 **itself**, with an HTML error page — so the Client
    # gets a body it cannot read as `problem+json` and shows "Server responded
    # with status 413" instead of naming the ceiling.
    #
    # Matched to the Server's own `Limits:MaxRequestBytes`. Whichever is smaller
    # is the real ceiling, and the one that refuses without a usable message
    # should not be this one.
    client_max_body_size 128m;

    # The Client uses history-based routing, so a deep link such as
    # /activities/PCN1/problems is not a file on disk. Everything that does not
    # match a real file has to fall back to index.html or a refresh 404s.
    location / {
        try_files $uri $uri/ @app;
    }

    # **The fallback, so that it is not cached either.** `location = /index.html`
    # below says `no-store`, but `try_files … /index.html` is an internal rewrite
    # served by `location /` — so the only request that ever reached that rule
    # was a literal `GET /index.html`, and every navigation, which is what
    # actually carries the asset hashes, got no cache policy at all.
    location @app {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    # **The worker must never be cached.** It is the one file that decides how
    # everything else is cached, and a browser holding an old copy holds old
    # rules for as long as it keeps it.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # `types { }` empties the map for this location so `default_type` always
    # decides. Whether the image's own `mime.types` knows `.webmanifest` varies
    # by nginx version, and a manifest served as `application/octet-stream` is
    # a manifest the browser ignores — with no error anybody would see.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Vite emits content-hashed asset filenames, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must not be cached, otherwise a deployed build keeps serving
    # the previous asset hashes.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;
}
