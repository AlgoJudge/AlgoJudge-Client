<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/algojudge.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlgoJudge</title>

    <!--
      What makes this installable.

      **The manifest is static, and says AlgoJudge rather than the operator's
      name.** Everything an installation calls itself — its name, its logo, its
      colours — arrives from the API after first paint and can change again over
      the event socket, so none of it is known when a browser reads this file.
      The tab title still follows the installation; the installed name does not.

      **`scope` is `/`, and it matters.** A federated sign-in leaves the
      application with a full-page navigation to
      `/api/v1/identity/providers/<slug>/challenge`, so a narrower scope would
      put the first hop of every sign-in outside the installed window.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#228be6" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The first is the standard one; the second is what iOS still reads. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AlgoJudge" />

    <!--
      Where an installation says which Server it talks to.

      Vite inlines `import.meta.env` at build time, so a value given there is
      baked into the bundle and the image is bound to whatever URL it was built
      with. The decision of 2026-08-03 is one image per installation, configured
      when the container starts — so the value is read from here, and the
      container's entrypoint rewrites this whole line before nginx serves it.
      Not `envsubst`: a `${…}` token here would be read literally by
      `npm run dev`, which substitutes nothing. `docker-entrypoint.sh` says so.

      **The name below belongs on one line, and on no other line of this file.**
      The entrypoint replaces every line that matches it — which is why none of
      this prose spells it out.

      Left as an empty object in the repository on purpose: `npm run dev` never
      goes through the entrypoint, and reads `import.meta.env` as it always did.
      Nothing here may hold a secret — it arrives in every browser.
    -->
    <script>window.__ALGOJUDGE__ = {};</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
