# The whole product on one machine: the Client, the Server and the database.
#
# The Server repository has one for the Server alone, which is what you want
# while working on it. This is the first file that brings all three up, and it
# exists because nothing else proves the two halves fit together — the Client's
# checks run against a fake and the Server's against no Client at all.
#
#   docker compose -f example-full-stack-docker-compose.yaml up -d --build --wait
#   open http://localhost:8082
#
# Paths assume the two repositories are siblings in the AlgoJudge workspace,
# which is how `docs/REPOSITORIES.md` says to check them out.
name: algojudge-full

# **Bounded, and the same driver an installation uses.** Docker left to itself
# keeps an unbounded `json-file`, which on a machine that judges all afternoon is
# a full disk. `AlgoJudge-Ops` pins `local` on every service it ships; this file
# does the same so that what a developer runs behaves like what an operator runs.
#
# Literal values rather than `${...}`: an example that needs an `.env` before it
# starts is an example that does not.
x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"
    # `local` compresses what it rotates unless told otherwise, and the daemon
    # refuses compression beside a single file. Three files, so it may stand.

services:

  postgres:
    logging: *logging
    # Pinned. An unpinned `postgres:latest` broke the Server's own stack once
    # already, when the image moved to a new major and PGDATA moved with it.
    image: postgres:18
    volumes:
      - algojudge_full_db:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=algojudge
      - POSTGRES_USER=algojudge
      - POSTGRES_DB=algojudge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algojudge -d algojudge"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    logging: *logging
    build:
      context: ../AlgoJudge-Server
      dockerfile: AlgoJudge.Server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      - DOTNET_ENVIRONMENT=Development
      - AJ_ConnectionStrings__DbConnectionString=Host=postgres;Database=algojudge;Username=algojudge;Password=algojudge
      # Appended, not from index 0: `appsettings.Development.json` already
      # names the dev-server origins, and an array is merged by index — starting
      # at 0 would overwrite them and break `npm run dev` against this stack.
      - AJ_Cors__AllowedOrigins__5=http://localhost:8082
      - AJ_Cors__AllowedOrigins__6=http://127.0.0.1:8082
      - AJ_Cors__AllowedOrigins__7=http://localhost:5190
      # **Two settings without which this Server does not start**, and it has
      # not since they landed — this file was written before both and nobody
      # ran it after. Neither has a default on purpose.
      #
      # Storage: an installation that configures no store does not start, so
      # that a deployment cannot accept an upload it has nowhere to put. The
      # Server's own compose runs an S3 container for this; there is none here,
      # and the database is already up, so the blob store is the database.
      - AJ_Storage__Stores__objects__Kind=postgres
      # And whose word to take for a visitor's address. This Server is reached
      # directly from the browser, with no proxy in front of it, so the answer
      # is `none` — trusting every sender of `X-Forwarded-For` would let a
      # visitor state their own address.
      - AJ_Forwarded__KnownProxies=none

  client:
    logging: *logging
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      server:
        condition: service_healthy
    ports:
      - '127.0.0.1:8082:80'
    environment:
      # Configured **here**, not at build: this is the whole point of the
      # entrypoint. The same image serves any installation, and the browser is
      # what reaches this address — so it is the address as the browser sees it,
      # not as the compose network does. `http://server:8080` would resolve
      # inside the network and nowhere in the user's browser.
      - API_BASE_URL=http://localhost:8080
      - USE_FAKE_API=false

volumes:
  algojudge_full_db:
